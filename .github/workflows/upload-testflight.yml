name: Upload-to-TestFlight

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "HTTPS URL of the signed .ipa"
        required: true

jobs:
  upload:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Fetch signed IPA
        run: |
          curl -sL --retry 3 -o ftv.ipa "${{ inputs.ipa_url }}"
          unzip -t ftv.ipa > /dev/null && echo "zip integrity OK"
          unzip -l ftv.ipa | grep "Payload/"

      - name: Install the ASC API key
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > "$HOME/.private_keys/AuthKey.p8"
          chmod 600 "$HOME/.private_keys/AuthKey.p8"

      - name: Show bundle identity
        run: |
          mkdir -p probe && cd probe
          unzip -qo ../ftv.ipa "Payload/*"
          APP=$(find . -maxdepth 2 -name "*.app" -type d | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          SHORT=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          BUILD=$(plutil -extract CFBundleVersion raw "$APP/Info.plist")
          NAME=$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist" 2>/dev/null || echo "?")
          echo "  the bundle id: $BID"
          echo "  the short version: $SHORT"
          echo "  the build: $BUILD"
          echo "  the display name: $NAME"
          # A build signed under the wrong bundle id lands in the wrong App
          # Store Connect app record. That is the pile-up bug from the
          # 2026-10-26 cleanup, so it is a hard stop here, not a warning.
          if [ "$BID" != "com.kxvn.plezy" ]; then
            echo "::error::the bundle id is $BID, expected com.kxvn.plezy - refusing to upload"
            exit 1
          fi
          if [ "$NAME" != "FTV" ]; then
            echo "::error::the display name is $NAME, expected FTV - refusing to upload"
            exit 1
          fi
          if [ "$BUILD" != "1170" ]; then
            echo "::error::the build is $BUILD, expected 1170 - refusing to upload"
            exit 1
          fi

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          # The app-specific password only existed in the old fork's secrets
          # and its value cannot be read back out of GitHub, so it cannot be
          # copied here. The ASC API key can - the .p8, the key id and the
          # issuer id all live on the VPS. altool does JWT auth natively.
          xcrun altool --upload-app --file ftv.ipa \
            --type ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tee upload.log
          if ! grep -q "No errors uploading" upload.log; then
            echo "::error::altool upload failed - see log above"
            exit 1
          fi
          echo "UPLOAD-DONE"